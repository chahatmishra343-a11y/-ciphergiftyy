<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CipherGiftyy — A Gift For You 🎁</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IM+Fell+English:ital@0;1&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"/>
<style>
:root{--ivory:#FFF9F4;--ink:#2C2523;--sepia:#5C3D2E;--rose:#E8547A;--gold:#D4A85A;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100vh;background:linear-gradient(160deg,#FFF9F4,#FFF0E8);font-family:'Lora',serif;color:var(--ink);cursor:none;overflow:hidden;}
.cursor{width:10px;height:10px;border-radius:50%;background:var(--rose);position:fixed;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);mix-blend-mode:multiply;}
.cursor-ring{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--gold);position:fixed;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;}
#burst-canvas{z-index:30;}
#bg-canvas{z-index:0;}

/* STAGE */
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;}

/* ===== THE BOX ===== */
.gift-box-wrap{position:relative;cursor:none;user-select:none;}
.gift-box-wrap:hover .box-body-el{filter:brightness(1.05);}

.box-body-el{
  width:180px;height:160px;
  border-radius:6px;
  position:relative;
  box-shadow:0 20px 50px rgba(0,0,0,0.15);
  transition:transform 0.1s;
}
.box-lid-el{
  width:196px;height:52px;
  border-radius:6px 6px 2px 2px;
  position:absolute;top:-52px;left:-8px;
  transform-origin:center bottom;
  transition:transform 1s cubic-bezier(.4,-0.5,.6,1.2);
  box-shadow:0 -8px 20px rgba(0,0,0,0.1);
  z-index:5;
}
.box-lid-el.open{transform:rotateX(180deg) translateY(20px);}
.box-ribbon-vert{position:absolute;top:0;left:50%;transform:translateX(-50%);width:14px;height:100%;opacity:0.35;border-radius:2px;}
.box-ribbon-horiz{position:absolute;top:50%;left:0;transform:translateY(-50%);width:100%;height:14px;opacity:0.35;border-radius:2px;}
.box-bow{position:absolute;top:-28px;left:50%;transform:translateX(-50%);font-size:2rem;z-index:6;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.2));}
.box-shine{position:absolute;top:8%;left:12%;width:22%;height:65%;background:linear-gradient(180deg,rgba(255,255,255,0.45),transparent);border-radius:50%;transform:rotate(15deg);pointer-events:none;}

/* BOX COLORS */
.box-rose .box-body-el{background:linear-gradient(160deg,#E8547A,#FF8FB8);}
.box-rose .box-lid-el{background:linear-gradient(160deg,#C9384A,#E8547A);}
.box-rose .box-ribbon-vert,.box-rose .box-ribbon-horiz{background:#FFF;}
.box-purple .box-body-el{background:linear-gradient(160deg,#9B59B6,#D4A8E8);}
.box-purple .box-lid-el{background:linear-gradient(160deg,#7D3C98,#9B59B6);}
.box-purple .box-ribbon-vert,.box-purple .box-ribbon-horiz{background:#FFE8F7;}
.box-gold .box-body-el{background:linear-gradient(160deg,#D4A85A,#F0D9A8);}
.box-gold .box-lid-el{background:linear-gradient(160deg,#B8860B,#D4A85A);}
.box-gold .box-ribbon-vert,.box-gold .box-ribbon-horiz{background:#FFF;}
.box-blue .box-body-el{background:linear-gradient(160deg,#3498DB,#A8D4F8);}
.box-blue .box-lid-el{background:linear-gradient(160deg,#1A6FA8,#3498DB);}
.box-blue .box-ribbon-vert,.box-blue .box-ribbon-horiz{background:#FFF;}

/* HINT */
.tap-hint{margin-top:2rem;font-style:italic;font-size:0.88rem;letter-spacing:0.15em;color:var(--sepia);animation:pulse 2s infinite;text-align:center;}
@keyframes pulse{0%,100%{opacity:0.45;}50%{opacity:1;}}

/* SHAKE ANIMATION */
@keyframes shake{
  0%,100%{transform:translateX(0) rotate(0);}
  10%{transform:translateX(-8px) rotate(-2deg);}
  20%{transform:translateX(8px) rotate(2deg);}
  30%{transform:translateX(-10px) rotate(-3deg);}
  40%{transform:translateX(10px) rotate(3deg);}
  50%{transform:translateX(-8px) rotate(-2deg);}
  60%{transform:translateX(8px) rotate(2deg);}
  70%{transform:translateX(-6px) rotate(-1deg);}
  80%{transform:translateX(6px) rotate(1deg);}
  90%{transform:translateX(-4px) rotate(-0.5deg);}
}
.shaking{animation:shake 0.8s ease both;}

/* ===== REVEAL SCREENS ===== */
/* PIC + LETTER */
.reveal-pic{
  position:fixed;inset:0;z-index:40;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:2rem;overflow-y:auto;
  opacity:0;pointer-events:none;transition:opacity 1s ease;
}
.reveal-pic.show{opacity:1;pointer-events:all;}
.pic-card{
  max-width:480px;width:100%;
  background:rgba(255,255,255,0.9);
  backdrop-filter:blur(16px);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 24px 70px rgba(0,0,0,0.14);
  animation:floatUp 1.1s ease both;
  margin-bottom:1.2rem;
}
@keyframes floatUp{from{transform:translateY(40px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.pic-img{width:100%;display:block;max-height:340px;object-fit:cover;}
.pic-name{font-family:'IM Fell English',serif;font-size:1.2rem;font-style:italic;color:var(--rose);text-align:center;padding:1.2rem 1.5rem 0.2rem;}
.pic-rule{width:40%;height:1px;margin:0.6rem auto 1rem;background:rgba(212,168,90,0.4);}
.pic-letter{font-family:'Cormorant Garamond',serif;font-size:1.02rem;font-style:italic;line-height:2;color:var(--ink);white-space:pre-line;padding:0 1.8rem 1.8rem;text-align:left;}
.pic-tag{text-align:center;font-style:italic;font-size:0.65rem;color:var(--gold);padding:0 0 1.2rem;letter-spacing:0.12em;}
.pic-tag a{color:inherit;text-decoration:none;}

/* CAKE + MESSAGE */
.reveal-cake{
  position:fixed;inset:0;z-index:40;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:2rem;overflow-y:auto;
  opacity:0;pointer-events:none;transition:opacity 1s ease;
}
.reveal-cake.show{opacity:1;pointer-events:all;}
.cake-card{
  max-width:440px;width:100%;
  background:rgba(255,255,255,0.9);
  backdrop-filter:blur(16px);
  border-radius:18px;
  padding:2.5rem 2rem;
  box-shadow:0 24px 70px rgba(0,0,0,0.14);
  animation:floatUp 1.1s ease both;
  text-align:center;
  margin-bottom:1rem;
}
.cake-big{font-size:5rem;margin-bottom:0.5rem;animation:bouncein 0.8s ease both 0.3s;display:block;}
@keyframes bouncein{from{transform:scale(0) rotate(-20deg);opacity:0;}80%{transform:scale(1.2) rotate(5deg);}to{transform:scale(1) rotate(0);opacity:1;}}
.cake-dear{font-family:'IM Fell English',serif;font-size:1.1rem;font-style:italic;color:var(--rose);display:block;margin-bottom:0.6rem;}
.animal-holder{font-size:3.5rem;display:block;margin:0.8rem 0;animation:bouncein 0.8s ease both 0.6s;}
.animal-sign{
  display:inline-block;
  background:linear-gradient(135deg,#FFF0E8,#FFE8F0);
  border:1.5px solid rgba(212,168,90,0.3);
  border-radius:8px;padding:0.8rem 1.4rem;
  font-family:'Cormorant Garamond',serif;
  font-size:1rem;font-style:italic;color:var(--ink);
  margin:0.5rem 0 1.2rem;
  animation:floatUp 0.8s ease both 0.9s;
  max-width:280px;line-height:1.7;
  white-space:pre-line;
}
.cake-rule{width:40%;height:1px;margin:1rem auto;background:rgba(212,168,90,0.3);}
.cake-tag{font-style:italic;font-size:0.65rem;color:var(--gold);letter-spacing:0.12em;}
.cake-tag a{color:inherit;text-decoration:none;}

@media(max-width:480px){
  .box-body-el{width:150px;height:130px;}
  .box-lid-el{width:166px;height:44px;top:-44px;left:-8px;}
}
</style>
</head>
<body>
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursor-ring"></div>
<canvas id="bg-canvas"></canvas>
<canvas id="burst-canvas"></canvas>

<!-- THE BOX -->
<div class="stage" id="stage">
  <div class="gift-box-wrap" id="box-wrap" onclick="handleTap()">
    <div class="box-lid-el" id="box-lid"></div>
    <div class="box-body-el" id="box-body">
      <div class="box-ribbon-vert"></div>
      <div class="box-ribbon-horiz"></div>
      <div class="box-shine"></div>
    </div>
    <div class="box-bow" id="box-bow">🎀</div>
  </div>
  <div class="tap-hint" id="tap-hint">✦ tap the gift to open it ✦</div>
</div>

<!-- PIC + LETTER REVEAL -->
<div class="reveal-pic" id="reveal-pic">
  <div class="pic-card">
    <img class="pic-img" id="reveal-pic-img" src="" alt=""/>
    <div class="pic-name" id="reveal-pic-name"></div>
    <div class="pic-rule"></div>
    <div class="pic-letter" id="reveal-pic-letter"></div>
    <div class="pic-tag">made with love on <a href="index.html">CipherGiftyy</a> 🌸</div>
  </div>
</div>

<!-- CAKE + MESSAGE REVEAL -->
<div class="reveal-cake" id="reveal-cake">
  <div class="cake-card">
    <span class="cake-big" id="reveal-cake-emoji">🎂</span>
    <span class="cake-dear" id="reveal-cake-dear"></span>
    <div class="cake-rule"></div>
    <span class="animal-holder" id="reveal-animal"></span>
    <div class="animal-sign" id="reveal-note"></div>
    <div class="cake-tag">made with love on <a href="index.html">CipherGiftyy</a> 🌸</div>
  </div>
</div>

<script>
const cur=document.getElementById('cursor'),ring=document.getElementById('cursor-ring');
document.addEventListener('mousemove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';setTimeout(()=>{ring.style.left=e.clientX+'px';ring.style.top=e.clientY+'px';},80);});

// READ DATA
function getData(){
  const params=new URLSearchParams(window.location.search);
  let raw=params.get('data');
  let def={chamber:'pic',box:'rose',cake:'birthday',animal:'🐼',name:'My Love',note:'',photo:''};
  if(!raw)return def;
  try{
    let b64;try{b64=decodeURIComponent(raw);}catch(e){b64=raw;}
    return Object.assign(def,JSON.parse(decodeURIComponent(escape(atob(b64)))));
  }catch(e){return def;}
}
const data=getData();

// Apply box style
const boxWrap=document.getElementById('box-wrap');
const boxBody=document.getElementById('box-body');
const boxLid=document.getElementById('box-lid');
boxWrap.classList.add('box-'+data.box);

// BOX COLORS for burst particles
const BOX_COLORS={
  rose:['rgba(232,84,122,','rgba(255,143,171,','rgba(255,200,210,'],
  purple:['rgba(155,89,182,','rgba(212,168,232,','rgba(240,220,255,'],
  gold:['rgba(212,168,90,','rgba(240,217,168,','rgba(255,240,200,'],
  blue:['rgba(52,152,219,','rgba,168,212,248,','rgba(200,230,255,']
};
const boxColors=BOX_COLORS[data.box]||BOX_COLORS.rose;

// Populate reveals
if(data.chamber==='pic'){
  document.getElementById('reveal-pic-img').src=data.photo;
  document.getElementById('reveal-pic-name').textContent='Dear '+data.name+',';
  document.getElementById('reveal-pic-letter').textContent=data.note;
} else {
  const cakeEmojis={birthday:'🎂',strawberry:'🍓',chocolate:'🍫',cupcake:'🧁'};
  document.getElementById('reveal-cake-emoji').textContent=cakeEmojis[data.cake]||'🎂';
  document.getElementById('reveal-cake-dear').textContent='Dear '+data.name+',';
  document.getElementById('reveal-animal').textContent=data.animal;
  document.getElementById('reveal-note').textContent=data.note;
}

// PHASE LOGIC
let phase=0;
function handleTap(){
  if(phase===0){
    phase=1;
    // SHAKE
    boxWrap.classList.add('shaking');
    setTimeout(()=>{
      boxWrap.classList.remove('shaking');
      phase=2;
      burst();
    },900);
  }
}

// BURST!
const burstCanvas=document.getElementById('burst-canvas');
const bctx=burstCanvas.getContext('2d');
let bW=burstCanvas.width=window.innerWidth,bH=burstCanvas.height=window.innerHeight;
window.addEventListener('resize',()=>{bW=burstCanvas.width=window.innerWidth;bH=burstCanvas.height=window.innerHeight;});

let burstPs=[];
const BURST_SYMBOLS=['🎁','✨','🌸','⭐','🎀','💕','🎊','🌟'];

function burst(){
  const rect=boxBody.getBoundingClientRect();
  const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;

  // Hide box
  document.getElementById('stage').style.opacity='0';
  document.getElementById('stage').style.transition='opacity 0.5s';

  // Spawn burst particles
  for(let i=0;i<80;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=Math.random()*10+4;
    const useEmoji=Math.random()<0.35;
    burstPs.push({
      x:cx,y:cy,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed-5,
      gravity:0.3,
      size:Math.random()*(useEmoji?24:16)+8,
      rot:Math.random()*Math.PI*2,
      rotS:(Math.random()-0.5)*0.3,
      color:boxColors[Math.floor(Math.random()*boxColors.length)],
      emoji:BURST_SYMBOLS[Math.floor(Math.random()*BURST_SYMBOLS.length)],
      useEmoji,
      op:1
    });
  }
  animateBurst();

  // Show reveal after burst
  setTimeout(()=>{
    if(data.chamber==='pic'){
      document.getElementById('reveal-pic').classList.add('show');
    } else {
      document.getElementById('reveal-cake').classList.add('show');
    }
  },1200);
}

let burstAF;
function animateBurst(){
  bctx.clearRect(0,0,bW,bH);
  burstPs=burstPs.filter(p=>p.op>0);
  burstPs.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.rot+=p.rotS;
    if(p.y>bH*0.8)p.op-=0.03;
    else p.op-=0.006;
    bctx.save();bctx.translate(p.x,p.y);bctx.rotate(p.rot);bctx.globalAlpha=Math.max(0,p.op);
    if(p.useEmoji){
      bctx.font=p.size+'px serif';bctx.textAlign='center';bctx.textBaseline='middle';
      bctx.fillText(p.emoji,0,0);
    } else {
      bctx.fillStyle=p.color+'1)';
      // Confetti shapes
      const shape=Math.floor(Math.random()*3);
      if(shape===0){bctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);}
      else if(shape===1){bctx.beginPath();bctx.arc(0,0,p.size/2,0,Math.PI*2);bctx.fill();}
      else{bctx.beginPath();bctx.moveTo(0,-p.size/2);bctx.lineTo(p.size/2,p.size/2);bctx.lineTo(-p.size/2,p.size/2);bctx.closePath();bctx.fill();}
    }
    bctx.restore();
  });
  if(burstPs.length>0)burstAF=requestAnimationFrame(animateBurst);
}

// BG Canvas
const bgC=document.getElementById('bg-canvas'),bgCtx=bgC.getContext('2d');
let bgW=bgC.width=window.innerWidth,bgH=bgC.height=window.innerHeight;
window.addEventListener('resize',()=>{bgW=bgC.width=window.innerWidth;bgH=bgC.height=window.innerHeight;});
const bgCols=['rgba(232,84,122,','rgba(255,179,210,','rgba(212,168,90,','rgba(122,159,130,'];
class BGP{constructor(){this.r(true);}r(i){this.x=Math.random()*bgW;this.y=i?Math.random()*bgH:-20;this.s=Math.random()*5+2;this.sy=Math.random()*0.3+0.1;this.sx=(Math.random()-0.5)*0.2;this.op=Math.random()*0.18+0.06;this.rot=Math.random()*Math.PI*2;this.rs=(Math.random()-0.5)*0.01;this.c=bgCols[Math.floor(Math.random()*bgCols.length)];this.w=Math.random()*Math.PI*2;this.ws=Math.random()*0.01+0.003;}u(){this.w+=this.ws;this.x+=this.sx+Math.sin(this.w)*0.2;this.y+=this.sy;this.rot+=this.rs;if(this.y>bgH+15)this.r(false);}d(){bgCtx.save();bgCtx.translate(this.x,this.y);bgCtx.rotate(this.rot);bgCtx.globalAlpha=this.op;bgCtx.fillStyle=this.c+'1)';bgCtx.beginPath();bgCtx.ellipse(0,0,this.s,this.s*1.6,0,0,Math.PI*2);bgCtx.fill();bgCtx.restore();}}
const bgPs=Array.from({length:24},()=>new BGP());
function bgLoop(){bgCtx.clearRect(0,0,bgW,bgH);bgPs.forEach(p=>{p.u();p.d();});requestAnimationFrame(bgLoop);}
bgLoop();
</script>
</body>
</html>
