<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CipherGiftyy — A Song For You 🎵</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IM+Fell+English:ital@0;1&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"/>
<style>
:root{--ivory:#FFF9F4;--ink:#2C2523;--sepia:#5C3D2E;--gold:#D4A85A;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100vh;font-family:'Lora',serif;color:var(--ink);cursor:none;overflow:hidden;transition:background 0.6s ease;background:#FFF0F3;}
.cursor{width:10px;height:10px;border-radius:50%;background:#E8547A;position:fixed;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);mix-blend-mode:multiply;}
.cursor-ring{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--gold);position:fixed;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;}

.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;padding:2rem;overflow-y:auto;}

.card{
  max-width:480px;width:100%;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(16px);
  border-radius:18px;
  padding:2.6rem 2.2rem;
  box-shadow:0 24px 70px rgba(0,0,0,0.12);
  text-align:center;
  border:1px solid rgba(255,255,255,0.6);
  animation:floatUp 1.1s ease both;
  margin:auto;
}
@keyframes floatUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}

.card-dear{font-family:'IM Fell English',serif;font-size:1.25rem;font-style:italic;margin-bottom:0.6rem;display:block;}
.card-tagline{font-style:italic;font-size:0.8rem;color:var(--sepia);margin-bottom:1.4rem;line-height:1.7;}
.card-rule{width:50%;height:1px;margin:1rem auto;background:rgba(212,168,90,0.4);}

.pic-frame{width:100%;border-radius:14px;overflow:hidden;margin-bottom:1.4rem;box-shadow:0 8px 30px rgba(0,0,0,0.1);position:relative;max-height:320px;}
.pic-frame img{width:100%;display:block;object-fit:cover;max-height:320px;}
.pic-frame::after{content:'';position:absolute;inset:0;border-radius:14px;border:3px solid rgba(255,255,255,0.4);pointer-events:none;}

.embed-wrap{width:100%;border-radius:14px;overflow:hidden;margin-bottom:1.2rem;box-shadow:0 8px 30px rgba(0,0,0,0.08);}
.embed-wrap iframe{display:block;width:100%;border:none;}

.note-body{font-family:'Cormorant Garamond',serif;font-size:1.05rem;font-style:italic;line-height:2;color:var(--ink);white-space:pre-line;margin-top:1rem;}
.card-tag{margin-top:1.4rem;font-style:italic;font-size:0.66rem;letter-spacing:0.12em;color:var(--gold);}
.card-tag a{color:inherit;text-decoration:none;}
.fallback-link{display:inline-block;padding:0.9rem 1.8rem;background:#2C2523;color:#FFF9F4;border-radius:10px;text-decoration:none;font-style:italic;font-size:0.85rem;margin-bottom:1rem;transition:transform 0.3s;}
.fallback-link:hover{transform:translateY(-2px);}

@media(max-width:480px){.card{padding:2rem 1.4rem;}}
</style>
</head>
<body>
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursor-ring"></div>
<canvas id="theme-canvas"></canvas>

<div class="stage">
  <div class="card" id="card">
    <span class="card-dear" id="card-dear"></span>
    <div class="card-tagline">This song reminds me of you 🎵</div>
    <div class="card-rule"></div>

    <div class="pic-frame" id="pic-frame" style="display:none;">
      <img id="card-pic" src="" alt="A picture of you"/>
    </div>

    <div class="embed-wrap" id="embed-wrap"></div>

    <div class="note-body" id="note-body"></div>
    <div class="card-tag">made with love on <a href="index.html">CipherGiftyy</a> 🌸</div>
  </div>
</div>

<script>
const cur=document.getElementById('cursor'),ring=document.getElementById('cursor-ring');
document.addEventListener('mousemove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';setTimeout(()=>{ring.style.left=e.clientX+'px';ring.style.top=e.clientY+'px';},80);});

// ---- ROBUST DATA READING ----
function getData(){
  const params=new URLSearchParams(window.location.search);
  let raw=params.get('data');
  let result={chamber:'anim',theme:'petals',song:'',name:'My Love',note:'',picture:''};
  if(!raw)return result;
  try{
    // First try: it was encoded with encodeURIComponent(btoa(...))
    let b64;
    try{ b64=decodeURIComponent(raw); }catch(e){ b64=raw; }
    const jsonStr=decodeURIComponent(escape(atob(b64)));
    const parsed=JSON.parse(jsonStr);
    return Object.assign(result,parsed);
  }catch(e){
    console.warn('Could not parse gift data',e);
    return result;
  }
}

const data=getData();

document.getElementById('card-dear').textContent='Dear '+(data.name||'My Love')+',';
document.getElementById('note-body').textContent=data.note||'';

// Picture
if(data.chamber==='pic' && data.picture){
  document.getElementById('pic-frame').style.display='block';
  document.getElementById('card-pic').src=data.picture;
}

// Embed song
const embedWrap=document.getElementById('embed-wrap');
function buildEmbed(url){
  if(!url){
    embedWrap.innerHTML='<p style="font-style:italic;color:#5C3D2E;font-size:0.85rem;">No song link was added. 🌸</p>';
    return;
  }
  let m=url.match(/open\.spotify\.com\/(track|playlist|album)\/([a-zA-Z0-9]+)/);
  if(m){
    const iframe=document.createElement('iframe');
    iframe.src='https://open.spotify.com/embed/'+m[1]+'/'+m[2];
    iframe.height='152';
    iframe.allow='autoplay; encrypted-media';
    iframe.loading='lazy';
    embedWrap.appendChild(iframe);
    return;
  }
  m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]+)/);
  if(m){
    const iframe=document.createElement('iframe');
    iframe.src='https://www.youtube.com/embed/'+m[1]+'?autoplay=0';
    iframe.height='220';
    iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    iframe.allowFullscreen=true;
    embedWrap.appendChild(iframe);
    return;
  }
  const a=document.createElement('a');
  a.href=url;a.target='_blank';
  a.className='fallback-link';
  a.textContent='♪ Play the song';
  embedWrap.appendChild(a);
}
buildEmbed(data.song);

// THEMES - richer, more saturated colors
const THEMES={
  petals:{bg:'linear-gradient(160deg,#FFE0EB,#FFC4D6)',cardBg:'rgba(255,255,255,0.78)',colors:['rgba(232,84,122,','rgba(255,143,171,','rgba(255,192,203,'],symbols:['🌸','🌹','❀','✿'],mode:'fall',textColor:'#2C2523'},
  snow:{bg:'linear-gradient(160deg,#E3F1FF,#C2E2FF)',cardBg:'rgba(255,255,255,0.8)',colors:['rgba(120,170,230,','rgba(180,215,250,','rgba(255,255,255,'],symbols:['❄️','✦','❅'],mode:'fall',textColor:'#1A2E4A'},
  stars:{bg:'linear-gradient(160deg,#241B45,#3D2F6B)',cardBg:'rgba(60,50,95,0.55)',colors:['rgba(240,201,90,','rgba(255,255,255,','rgba(200,180,240,'],symbols:['⭐','✨','✦','🌙'],mode:'twinkle',textColor:'#F4EFE8'}
};
const th=THEMES[data.theme]||THEMES.petals;
document.body.style.background=th.bg;
document.getElementById('card').style.background=th.cardBg;
document.getElementById('card').style.color=th.textColor;
document.querySelectorAll('.card-tagline,.note-body').forEach(el=>el.style.color=th.textColor);
if(data.theme==='stars'){
  document.querySelector('.card-tag').style.color='#F0C95A';
  document.querySelector('.card-dear').style.color='#F0C95A';
}

// CANVAS ANIMATION
const canvas=document.getElementById('theme-canvas'),ctx=canvas.getContext('2d');
let W=canvas.width=window.innerWidth,H=canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;});
let mouse={x:W/2,y:H/2};
document.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});

class FallParticle{
  constructor(){this.reset(true);}
  reset(init){
    this.x=Math.random()*W;
    this.y=init?Math.random()*H:-20;
    this.size=Math.random()*16+10;
    this.speedY=Math.random()*0.6+0.25;
    this.speedX=(Math.random()-0.5)*0.3;
    this.opacity=Math.random()*0.7+0.3;
    this.rotation=Math.random()*Math.PI*2;
    this.rotSpeed=(Math.random()-0.5)*0.02;
    this.symbol=th.symbols[Math.floor(Math.random()*th.symbols.length)];
    this.color=th.colors[Math.floor(Math.random()*th.colors.length)];
    this.wobble=Math.random()*Math.PI*2;
    this.wobbleSpeed=Math.random()*0.015+0.004;
    this.useEmoji=Math.random()<0.75;
  }
  update(){
    this.wobble+=this.wobbleSpeed;
    this.x+=this.speedX+Math.sin(this.wobble)*0.4;
    this.y+=this.speedY;
    this.rotation+=this.rotSpeed;
    const dx=this.x-mouse.x,dy=this.y-mouse.y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<80){this.x+=dx/d*0.6;this.y+=dy/d*0.6;}
    if(this.y>H+20)this.reset(false);
  }
  draw(){
    ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rotation);ctx.globalAlpha=this.opacity;
    if(this.useEmoji){
      ctx.font=this.size+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(this.symbol,0,0);
    } else {
      ctx.fillStyle=this.color+'1)';ctx.beginPath();
      ctx.ellipse(0,0,this.size*0.3,this.size*0.5,0,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
}

class TwinkleStar{
  constructor(){this.reset();}
  reset(){
    this.x=Math.random()*W;
    this.y=Math.random()*H;
    this.size=Math.random()*3+1.5;
    this.symbol=th.symbols[Math.floor(Math.random()*th.symbols.length)];
    this.useEmoji=Math.random()<0.35;
    this.emojiSize=Math.random()*14+10;
    this.opacity=Math.random();
    this.twinkleSpeed=Math.random()*0.03+0.01;
    this.color=th.colors[Math.floor(Math.random()*th.colors.length)];
    this.driftY=Math.random()*0.05+0.01;
  }
  update(){
    this.opacity+=this.twinkleSpeed;
    if(this.opacity>1||this.opacity<0)this.twinkleSpeed*=-1;
    this.y+=this.driftY;
    if(this.y>H)this.y=0;
  }
  draw(){
    ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,this.opacity));
    if(this.useEmoji){
      ctx.font=this.emojiSize+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(this.symbol,this.x,this.y);
    } else {
      ctx.fillStyle=this.color+'1)';ctx.beginPath();
      ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
}

let particles=[];
if(th.mode==='fall'){
  particles=Array.from({length:60},()=>new FallParticle());
} else {
  particles=Array.from({length:100},()=>new TwinkleStar());
}

function animate(){
  ctx.clearRect(0,0,W,H);
  particles.forEach(p=>{p.update();p.draw();});
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
